<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>临时链接生成器 | 48小时跳转链接</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        .logo {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        
        .tagline {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .result.active {
            display: block;
        }
        
        .link-box {
            background: white;
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
        }
        
        .share-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .share-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
        }
        
        .qr-code {
            margin: 20px 0;
            text-align: center;
        }
        
        .qr-code canvas {
            max-width: 200px;
            margin: 0 auto;
        }
        
        .instructions {
            background: #fff8e1;
            border-left: 4px solid #ffb300;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
            text-align: left;
        }
        
        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
        
        .timer {
            font-size: 14px;
            color: #667eea;
            margin-top: 10px;
            font-weight: 500;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .logo {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⏰ TempLink</div>
        <div class="tagline">创建48小时有效期的临时跳转链接，分享给他人</div>
        
        <div class="input-group">
            <label for="targetUrl">输入目标网址：</label>
            <input type="url" id="targetUrl" placeholder="https://example.com" required>
        </div>
        
        <div class="input-group">
            <label for="customSlug">自定义短链接（可选）：</label>
            <input type="text" id="customSlug" placeholder="my-link" pattern="[a-zA-Z0-9\-_]+">
        </div>
        
        <button id="generateBtn">生成临时链接</button>
        
        <div class="instructions">
            <h4>使用说明：</h4>
            <p>1. 生成的链接将在48小时后失效</p>
            <p>2. 被分享的链接会继承剩余时间</p>
            <p>3. 链接被点击后开始倒计时</p>
            <p>4. 支持二维码分享，方便移动端访问</p>
        </div>
        
        <div class="result" id="resultSection">
            <h3>📎 你的临时链接已生成</h3>
            <div class="link-box" id="generatedLink"></div>
            <div class="timer">⏰ 有效期剩余：<span id="timeRemaining">48:00:00</span></div>
            
            <div class="qr-code">
                <canvas id="qrCanvas"></canvas>
                <p>扫描二维码访问链接</p>
            </div>
            
            <div class="share-buttons">
                <button id="copyBtn">📋 复制链接</button>
                <button id="shareBtn">🔗 生成分享链接</button>
                <button id="testBtn">🚀 测试跳转</button>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2024 TempLink | 基于 GitHub Pages 免费托管</p>
            <p>所有链接将在48小时后自动失效</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
